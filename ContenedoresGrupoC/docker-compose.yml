version: '3.8'

services:
  # 1. Contenedor de la Base de Datos Global
  mysql-db:
    build:
      context: ./Contenedor_Db  # Apunta a la carpeta donde está tu Dockerfile de MySQL y el init.sql
    container_name: sanos_salvos_db
    ports:
      - "3307:3306"
    environment:
      # Leerá la contraseña desde tu archivo .env
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # Reemplazamos la contraseña hardcodeada aquí también
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_PASSWORD}"]
      timeout: 20s
      retries: 10

  # 2. Contenedor del Microservicio de Usuarios
  usuarios-api:
    build:
      context: ./Contenedor_Usuarios 
    container_name: api-usuarios
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy 
    environment:
      - DB_HOST=mysql-db 
      - DB_PORT=3306
      - DB_NAME=usuariosdb
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET}
      - JWT_EXPIRATION_MS=86400000
      # NUEVO: Agregamos las variables de correo ocultas
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}

  # 3. Contenedor del Microservicio de Mascotas
  mascotas-api:
    build:
      context: ./Contenedor_Mascotas 
    container_name: api-mascotas
    ports:
      - "8081:8081" 
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - DB_HOST=mysql-db 
      - DB_PORT=3306
      - DB_NAME=mascotasdb
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - GEOLOCALIZACION_API_URL=http://api-geolocalizacion:8082
    volumes:
      - ./uploads/imagenes:/app/uploads/imagenes 

  # 4. Microservicio Geolocalización
  geolocalizacion-api:
    build:
      context: ./Contenedor_Geolocalizacion 
    container_name: api-geolocalizacion
    ports:
      - "8082:8082"
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8082
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=geolocalizaciondb
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET} 

  # 5. Microservicio Motor de Coincidencias
  coincidencias-api:
    build:
      context: ./Contenedor_Coincidencias 
    container_name: api-coincidencias
    ports:
      - "8083:8083" 
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=coincidenciasdb
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET}
      - MASCOTAS_API_URL=http://api-mascotas:8081
      - GEOLOCALIZACION_API_URL=http://api-geolocalizacion:8082

volumes:
  mysql_data:
version: '3.8'

services:
  # 1. Contenedor de la Base de Datos Global
  mysql-db:
    build:
      context: ./Db
    container_name: sanos_salvos_db_grupoc # <-- Nombre único
    ports:
      - "3333:3306" # <-- Puerto externo único (3333)
    environment:
      MYSQL_ROOT_PASSWORD: stefy
    volumes:
      - mysql_data_grupoc:/var/lib/mysql # <-- Volumen único
    networks:
      - red_grupoc # <-- Red aislada
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pstefy"]
      timeout: 20s
      retries: 10

  # 2. Contenedor del Microservicio de Usuarios
  usuarios-api:
    build:
      context: ./Backend/usuarios
    container_name: api-usuarios-grupoc # <-- Nombre único
    ports:
      - "8380:8080" # <-- Puerto externo único (8380)
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - DB_HOST=mysql-db 
      - DB_PORT=3306
      - DB_NAME=usuariosdb
      - DB_USER=root
      - DB_PASSWORD=stefy
      - JWT_SECRET_KEY=UHJveWVjdG9HcnVwb0NTYW5vc1lTYWx2b3NTZWNyZXRLZXkyMDI2ISE=
      - JWT_EXPIRATION_MS=86400000
    networks:
      - red_grupoc # <-- Red aislada

  # 3. Contenedor del Microservicio de Mascotas
  mascotas-api:
    build:
      context: ./Backend/mascotas
    container_name: api-mascotas-grupoc # <-- Nombre único
    ports:
      - "8381:8081" # <-- Puerto externo único (8381)
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8081
      - DB_HOST=mysql-db 
      - DB_PORT=3306
      - DB_NAME=mascotasdb
      - DB_USER=root
      - DB_PASSWORD=stefy
      - JWT_SECRET=UHJveWVjdG9HcnVwb0NTYW5vc1lTYWx2b3NTZWNyZXRLZXkyMDI2ISE=
      - GEOLOCALIZACION_API_URL=http://geolocalizacion-api:8082 # Usa el nombre del servicio
    volumes:
      - ./uploads/imagenes:/app/uploads/imagenes
    networks:
      - red_grupoc # <-- Red aislada

  # 4. Microservicio Geolocalización
  geolocalizacion-api:
    build:
      context: ./Backend/geolocalizacion
    container_name: api-geolocalizacion-grupoc # <-- Nombre único
    ports:
      - "8382:8082" # <-- Puerto externo único (8382)
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - SERVER_PORT=8082
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=geolocalizaciondb
      - DB_USER=root
      - DB_PASSWORD=stefy
      - JWT_SECRET_KEY=UHJveWVjdG9HcnVwb0NTYW5vc1lTYWx2b3NTZWNyZXRLZXkyMDI2ISE=
    networks:
      - red_grupoc # <-- Red aislada

  # 5. Microservicio Motor de Coincidencias
  coincidencias-api:
    build:
      context: ./Backend/motor_coincidencias
    container_name: api-coincidencias-grupoc # <-- Nombre único
    ports:
      - "8383:8083" # <-- Puerto externo único (8383)
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_NAME=coincidenciasdb
      - DB_USER=root
      - DB_PASSWORD=stefy
      - JWT_SECRET_KEY=UHJveWVjdG9HcnVwb0NTYW5vc1lTYWx2b3NTZWNyZXRLZXkyMDI2ISE=
      - MASCOTAS_API_URL=http://mascotas-api:8081 # Usa el nombre del servicio
      - GEOLOCALIZACION_API_URL=http://geolocalizacion-api:8082 # Usa el nombre del servicio
    networks:
      - red_grupoc # <-- Red aislada

# Declaración de recursos compartidos (solo para este grupo)
volumes:
  mysql_data_grupoc:

networks:
  red_grupoc:
    driver: bridge
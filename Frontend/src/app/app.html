<div class="app-container">
      
  <div *ngIf="mostrarMenu" class="sidebar-wrapper">
    
    <button class="hamburger-btn" (click)="toggleMenu()" aria-label="Menu">
      <span *ngIf="!isMenuOpen">☰</span>
      <span *ngIf="isMenuOpen">✕</span>
    </button>

    <nav class="vertical-menu" [class.open]="isMenuOpen">
      <div class="menu-brand">
        <h2 class="fw-bold"> Sanos y Salvos 🐾</h2>
      </div>
      
      <ul class="menu-items">
        <li><a routerLink="/principal" (click)="closeMenu()">🏠 Inicio Principal</a></li>
        <li><a routerLink="/report" (click)="closeMenu()">📢 Reportar Mascota</a></li>
        <li><a style="cursor: pointer;" (click)="abrirMapaGlobal()">🗺️ Mapa Global</a></li>
        <li><a routerLink="/reportHistory" (click)="closeMenu()">📋 Mis Reportes</a></li>
        <li><a routerLink="/perfil" (click)="closeMenu()">👤 Mi Perfil</a></li>
        <li class="logout-item">
          <a routerLink="/login" (click)="logout()">🚪 Cerrar Sesión</a>
        </li>
      </ul>
    </nav>
    
    <div *ngIf="isMenuOpen" class="backdrop" (click)="closeMenu()"></div>
  </div>

  <main class="main-content" [class.shifted]="isMenuOpen && mostrarMenu">
    <router-outlet></router-outlet>
  </main>

  <app-mapa-global 
    [isOpen]="isMapaGlobalOpen" 
    (close)="cerrarMapaGlobal()">
  </app-mapa-global>

</div>
